name: Test simulation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
      - run: npm run balance
